    <script>
      (function () {
        var m = 'system';
        try { m = localStorage.getItem('netforecast-theme') || 'system'; } catch (e) {}
        var dark = m === 'dark' || (m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
